openapi: 3.0.3

info:
  title: Student Portal Management System API
  version: 1.0.0
  description: |
    REST API documentation for the Student Portal Management System.
    The API supports authentication, role-based authorization, user management,
    students, courses, enrollments, dashboards, and role permissions.

servers:
  - url: http://localhost:5001/api
    description: Local development server

tags:
  - name: Health
    description: API health checks
  - name: Authentication
    description: Login and current-user authentication
  - name: Users
    description: User account management
  - name: Students
    description: Student management
  - name: Courses
    description: Course management
  - name: Enrollments
    description: Enrollment management
  - name: Dashboard
    description: Dashboard information
  - name: Role Permissions
    description: Role-based permission management

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check API health
      description: Verify that the API is running. Confirm this path matches the health route configured in your backend.
      security: []
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Authenticate a user and return an access token and user profile.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: admin@example.com
              password: ChangeMe123!
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing or invalid input
        "401":
          description: Invalid credentials
        "403":
          description: Account is inactive
        "500":
          description: Internal server error

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get the current user
      description: Return the authenticated user's profile and, if implemented, permissions.
      responses:
        "200":
          description: Current user retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid, or expired access token
        "403":
          description: Account is inactive

  /users:
    get:
      tags:
        - Users
      summary: List user accounts
      description: Requires the appropriate user-read permission.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Users retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions

    post:
      tags:
        - Users
      summary: Create a user account
      description: Requires the appropriate user-create permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid input
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "409":
          description: Email already exists

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: User retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: User not found

    patch:
      tags:
        - Users
      summary: Update a user account
      description: Confirm the supported editable fields in the user controller.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid input
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: User not found

    delete:
      tags:
        - Users
      summary: Delete a user account
      description: Include this operation only if account deletion is implemented and permitted.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: User deleted
        "204":
          description: User deleted without a response body
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: User not found

  /users/{id}/status:
    patch:
      tags:
        - Users
      summary: Activate or deactivate a user
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
            example:
              isActive: false
      responses:
        "200":
          description: User status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid status
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: User not found

  /students:
    get:
      tags:
        - Students
      summary: List students
      description: Actual access may be restricted to assigned students or the authenticated student's own record.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Students retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions

    post:
      tags:
        - Students
      summary: Create a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentRequest"
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid student data
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "409":
          description: Duplicate student record

  /students/{id}:
    get:
      tags:
        - Students
      summary: Get a student by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Student retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Student not found

    patch:
      tags:
        - Students
      summary: Update a student
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentRequest"
      responses:
        "200":
          description: Student updated
        "400":
          description: Invalid student data
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Student not found

    delete:
      tags:
        - Students
      summary: Delete a student
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Student deleted
        "204":
          description: Student deleted without a response body
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Student not found

  /courses:
    get:
      tags:
        - Courses
      summary: List courses
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Courses retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions

    post:
      tags:
        - Courses
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "201":
          description: Course created
        "400":
          description: Invalid course data
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "409":
          description: Duplicate course

  /courses/{id}:
    get:
      tags:
        - Courses
      summary: Get a course by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Course retrieved
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Course not found

    patch:
      tags:
        - Courses
      summary: Update a course
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseRequest"
      responses:
        "200":
          description: Course updated
        "400":
          description: Invalid course data
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Course not found

    delete:
      tags:
        - Courses
      summary: Delete a course
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Course deleted
        "204":
          description: Course deleted without a response body
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Course not found

  /enrollments:
    get:
      tags:
        - Enrollments
      summary: List enrollments
      description: Results should be limited according to the user's permissions and record ownership.
      parameters:
        - name: studentId
          in: query
          schema:
            type: string
        - name: courseId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Enrollments retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions

    post:
      tags:
        - Enrollments
      summary: Enroll a student in a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnrollmentRequest"
      responses:
        "201":
          description: Enrollment created
        "400":
          description: Invalid enrollment data
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Student or course not found
        "409":
          description: Duplicate enrollment

  /enrollments/{id}:
    get:
      tags:
        - Enrollments
      summary: Get an enrollment by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Enrollment retrieved
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Enrollment not found

    patch:
      tags:
        - Enrollments
      summary: Update an enrollment
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnrollmentRequest"
      responses:
        "200":
          description: Enrollment updated
        "400":
          description: Invalid enrollment data
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Enrollment not found

    delete:
      tags:
        - Enrollments
      summary: Delete an enrollment
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Enrollment deleted
        "204":
          description: Enrollment deleted without a response body
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Enrollment not found

  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Get dashboard data
      description: Returns summary information allowed for the authenticated user's role.
      responses:
        "200":
          description: Dashboard data retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions

  /role-permissions:
    get:
      tags:
        - Role Permissions
      summary: Get role permission configuration
      description: Requires the role-permissions read permission.
      responses:
        "200":
          description: Role permissions retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions

    put:
      tags:
        - Role Permissions
      summary: Replace role permission configuration
      description: Use only if your backend implements PUT for updating role permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRolePermissionsRequest"
      responses:
        "200":
          description: Role permissions updated
        "400":
          description: Invalid permission configuration
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the access token returned by the login endpoint.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema:
        type: string
      example: 65f123456789abcdef012345

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          type: object
          additionalProperties: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: ChangeMe123!

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Token lifetime in seconds
          example: 86400
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
          example: Example Administrator
        email:
          type: string
          format: email
          example: admin@example.com
        role:
          type: string
          enum:
            - admin
            - instructor
            - student
        isActive:
          type: boolean
        permissions:
          type: array
          items:
            type: string
          example:
            - dashboard.read
            - users.read
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - fullName
        - email
        - password
        - role
      properties:
        fullName:
          type: string
          minLength: 2
          example: Example Instructor
        email:
          type: string
          format: email
          example: instructor@example.com
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum:
            - admin
            - instructor
            - student
        isActive:
          type: boolean
          default: true

    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - admin
            - instructor
            - student
        isActive:
          type: boolean

    UpdateUserStatusRequest:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean
          example: false

    CreateStudentRequest:
      type: object
      description: Adjust properties to match the Student model and Zod validation schema.
      properties:
        fullName:
          type: string
          example: Example Student
        email:
          type: string
          format: email
          example: student@example.com
        studentId:
          type: string
          example: STU-2026-001
        phone:
          type: string
        department:
          type: string

    UpdateStudentRequest:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        department:
          type: string

    CreateCourseRequest:
      type: object
      description: Adjust properties to match the Course model and Zod validation schema.
      properties:
        courseCode:
          type: string
          example: SE301
        title:
          type: string
          example: Web Application Development
        description:
          type: string
        credits:
          type: integer
          minimum: 0
          example: 3
        instructorId:
          type: string

    UpdateCourseRequest:
      type: object
      properties:
        courseCode:
          type: string
        title:
          type: string
        description:
          type: string
        credits:
          type: integer
          minimum: 0
        instructorId:
          type: string

    CreateEnrollmentRequest:
      type: object
      required:
        - studentId
        - courseId
      properties:
        studentId:
          type: string
          example: 65f123456789abcdef012345
        courseId:
          type: string
          example: 65f987654321abcdef012345
        status:
          type: string
          enum:
            - enrolled
            - completed
            - dropped
          default: enrolled

    UpdateEnrollmentRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - enrolled
            - completed
            - dropped

    UpdateRolePermissionsRequest:
      type: object
      description: Adjust the structure to match the actual role-permission controller and service.
      additionalProperties: true
      example:
        role: instructor
        permissions:
          - dashboard.read
          - courses.read_assigned
          - students.read_assigned
          - enrollments.read_assigned

